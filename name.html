<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>前世我叫什么</title>
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #0a0a0a;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      user-select: none;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .game-shell {
      position: relative;
      width: min(100vw - 24px, 430px);
      aspect-ratio: 1180 / 2556;
      max-height: 92vh;
      overflow: hidden;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      background: #000;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65);
    }

    #gameCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }

    .hud {
      position: absolute;
      z-index: 10;
      left: 0;
      right: 0;
      top: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      color: rgba(255, 255, 255, 0.82);
      font-size: 14px;
      pointer-events: none;
    }

    .hud-title {
      font-weight: 700;
    }

    #restartBtn {
      position: absolute;
      z-index: 20;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: none;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 999px;
      padding: 9px 20px;
      background: rgba(255, 255, 255, 0.12);
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      cursor: pointer;
    }

    #restartBtn:active {
      transform: translateX(-50%) scale(0.95);
    }
  </style>
</head>
<body>
  <div class="game-shell" id="gameShell">
    <canvas id="gameCanvas"></canvas>

    <div class="hud">
      <span class="hud-title">复刻版 Demo</span>
      <span id="hudTime">待开始</span>
    </div>

    <button id="restartBtn">再玩一次：随机名字</button>
  </div>

  <script>
    const PLAY_SECONDS = 5;

    const LETTERS = [
      "白", "子", "多", "鸡", "宝", "二", "黄", "八", "狗", "马", "大", "牛", "小", "鹿", "歌",
      "黑", "王", "猫", "龙", "虎", "蛋", "皮", "花", "米", "瓜", "鸭", "羊", "鱼", "赵", "钱", "孙", "李",
      "阿", "旺", "铁", "蛋", "翠", "兰", "胖", "球", "豆", "包", "福", "贵"
    ];

    const COLORS = [
      "#ff3f77", "#ffcf3c", "#59e7d8", "#8cf14b", "#70a5ff", "#ffffff", "#d7d7d7", "#cc55ff",
      "#ff9445", "#f25b5b", "#76ff6a", "#42d1ff", "#ffd1e8", "#b4ff5c", "#ff7bd5"
    ];

    const shell = document.getElementById("gameShell");
    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");
    const hudTime = document.getElementById("hudTime");
    const restartBtn = document.getElementById("restartBtn");

    let game = null;
    let raf = 0;
    let last = performance.now();
    let hudTimer = 0;

    const rand = (min, max) => min + Math.random() * (max - min);
    const clamp = (v, min, max) => Math.max(min, Math.min(max, v));

    function easeInOutCubic(t) {
      t = clamp(t, 0, 1);
      return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    }

    function easeOutCubic(t) {
      t = clamp(t, 0, 1);
      return 1 - Math.pow(1 - t, 3);
    }

    function basketSize(w, h) {
      return {
        width: Math.min(132, w * 0.31),
        height: Math.min(68, h * 0.08),
        line: Math.max(8, Math.min(10.5, w * 0.023)),
      };
    }

    function updateHud() {
      if (!game) return;

      if (game.phase === "playing") {
        hudTime.textContent = `${Math.max(0, PLAY_SECONDS - game.time).toFixed(1)}s`;
        restartBtn.style.display = "none";
      } else if (game.phase === "ending") {
        hudTime.textContent = "结算";
        restartBtn.textContent = `再玩一次：${game.result || "未接到字"}`;
        restartBtn.style.display = "block";
      } else {
        hudTime.textContent = "待开始";
        restartBtn.style.display = "none";
      }
    }

    function resize() {
      const rect = shell.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;

      canvas.width = Math.floor(rect.width * dpr);
      canvas.height = Math.floor(rect.height * dpr);
      canvas.style.width = `${rect.width}px`;
      canvas.style.height = `${rect.height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

      if (!game) return;

      game.w = rect.width;
      game.h = rect.height;
      game.groundY = rect.height * 0.858;
      game.titleY = rect.height * 0.29;

      const s = basketSize(game.w, game.h);
      game.basket.width = s.width;
      game.basket.height = s.height;
      game.basket.line = s.line;
      game.basket.y = game.groundY - 9;
      game.basket.x = clamp(game.basket.x, game.basket.width / 2 + 18, game.w - game.basket.width / 2 - 18);
      game.basket.targetX = clamp(game.basket.targetX, game.basket.width / 2 + 18, game.w - game.basket.width / 2 - 18);
      game.basket.displayX = game.basket.displayX || game.basket.x;
      game.basket.displayY = game.basket.displayY || game.basket.y;
    }

    function newGame() {
      const rect = shell.getBoundingClientRect();
      const groundY = rect.height * 0.858;
      const s = basketSize(rect.width, rect.height);

      game = {
        w: rect.width,
        h: rect.height,
        groundY,
        titleY: rect.height * 0.29,
        time: 0,
        phase: "ready",
        letters: [],
        nextSpawn: 0,
        spawnCount: 0,
        result: "",
        pointerDown: false,
        basket: {
          x: rect.width * 0.5,
          targetX: rect.width * 0.5,
          y: groundY - 9,
          width: s.width,
          height: s.height,
          line: s.line,
          displayX: rect.width * 0.5,
          displayY: groundY - 9,
        },
        endingTime: 0,
        lineProgress: 0,
        lineY: 0,
        wipeDone: false,
        showFinalText: false,
      };

      updateHud();
    }

    function randomLetter() {
      return LETTERS[Math.floor(rand(0, LETTERS.length))];
    }

    function makeLetter(ch, forcedX = null, opts = {}) {
      const g = game;
      const size = opts.size ?? Math.min(45, Math.max(33, g.w * 0.098));
      const r = size * 0.44;
      const x = forcedX ?? rand(r + 12, g.w - r - 12);
      const y = opts.y ?? (g.titleY + 64 + rand(-86, 0));

      return {
        id: `${Date.now()}-${Math.random()}`,
        ch,
        x,
        y,
        prevX: x,
        prevY: y,
        vx: opts.vx ?? rand(-58, 58),
        vy: opts.vy ?? rand(36, 92),
        r,
        font: size,
        color: opts.color ?? COLORS[Math.floor(rand(0, COLORS.length))],
        angle: rand(-0.08, 0.08),
        av: rand(-0.85, 0.85),
        showcase: false,
        extra: !!opts.extra,
        pushed: false,
        dead: false,
      };
    }

    function startGame() {
      if (!game || game.phase !== "ready") return;

      game.phase = "playing";
      game.time = 0;
      game.letters = [];
      game.nextSpawn = 0;
      game.spawnCount = 0;
      game.result = "";
      game.endingTime = 0;
      game.lineProgress = 0;
      game.wipeDone = false;
      game.showFinalText = false;

      updateHud();
    }

    function restart() {
      newGame();
      requestAnimationFrame(startGame);
    }

    function spawn(dt) {
      const g = game;
      g.nextSpawn -= dt;
      if (g.nextSpawn > 0) return;

      const t = g.time;
      let batch = 1;
      let interval = 0.56;

      if (t > 1.5) {
        batch = Math.random() < 0.34 ? 2 : 1;
        interval = 0.38;
      }
      if (t > 3.2) {
        batch = Math.random() < 0.48 ? 2 : 1;
        interval = 0.28;
      }
      if (t > 4.25) {
        batch = Math.random() < 0.62 ? 2 : 3;
        interval = 0.22;
      }

      for (let i = 0; i < batch; i++) {
        const ch = randomLetter();
        const letter = makeLetter(ch);
        letter.y -= i * 48;
        letter.vy += Math.min(170, 23 * g.spawnCount);
        g.letters.push(letter);
        g.spawnCount += 1;
      }

      g.nextSpawn = interval * rand(0.82, 1.22);
    }

    function basketSegments(g, useDisplay = false) {
      const b = g.basket;
      const x = useDisplay ? b.displayX : b.x;
      const y = useDisplay ? b.displayY : b.y;
      const w = b.width;
      const h = b.height;

      return [
        { ax: x - w / 2, ay: y, bx: x + w / 2, by: y, type: "base" },
        { ax: x - w / 2, ay: y, bx: x - w * 0.66, by: y - h, type: "left" },
        { ax: x + w / 2, ay: y, bx: x + w * 0.66, by: y - h, type: "right" },
      ];
    }

    function collideCircleSegment(o, seg, restitution = 0.62, friction = 0.74) {
      const abx = seg.bx - seg.ax;
      const aby = seg.by - seg.ay;
      const apx = o.x - seg.ax;
      const apy = o.y - seg.ay;
      const ab2 = abx * abx + aby * aby || 1;
      const t = clamp((apx * abx + apy * aby) / ab2, 0, 1);
      const cx = seg.ax + abx * t;
      const cy = seg.ay + aby * t;

      let nx = o.x - cx;
      let ny = o.y - cy;
      let d = Math.hypot(nx, ny);
      const minD = o.r + 4.5;

      if (d <= 0.0001) {
        nx = 0;
        ny = -1;
        d = 1;
      }

      if (d < minD) {
        nx /= d;
        ny /= d;

        const overlap = minD - d;
        o.x += nx * overlap * 1.22;
        o.y += ny * overlap * 1.22;

        const vn = o.vx * nx + o.vy * ny;
        if (vn < 0) {
          o.vx -= (1 + restitution) * vn * nx;
          o.vy -= (1 + restitution) * vn * ny;

          const tx = -ny;
          const ty = nx;
          const vt = o.vx * tx + o.vy * ty;
          o.vx -= vt * (1 - friction) * tx;
          o.vy -= vt * (1 - friction) * ty;

          o.av += vt * 0.01;
        }

        return true;
      }

      return false;
    }

    function isInsideBasket(o, g, useDisplay = false) {
      const b = g.basket;
      const bx = useDisplay ? b.displayX : b.x;
      const by = useDisplay ? b.displayY : b.y;
      return (
        Math.abs(o.x - bx) < b.width * 0.5 &&
        o.y > by - b.height * 0.98 &&
        o.y < by + 12
      );
    }

    function getCaughtLetters(g) {
      return g.letters
        .filter((o) => !o.dead && !o.extra && !o.pushed && isInsideBasket(o, g, false))
        .sort((a, b) => a.x - b.x);
    }

    function resolveLetterPairs(list, g) {
      for (let i = 0; i < list.length; i++) {
        for (let j = i + 1; j < list.length; j++) {
          const a = list[i];
          const b = list[j];
          if (a.dead || b.dead || a.showcase || b.showcase) continue;

          const dx = b.x - a.x;
          const dy = b.y - a.y;
          const insideA = isInsideBasket(a, g);
          const insideB = isInsideBasket(b, g);
          const aroundBasket = insideA || insideB;

          const minD = aroundBasket ? a.r + b.r + 7 : a.r + b.r - 2.5;
          const d2 = dx * dx + dy * dy;
          if (d2 <= 0.0001 || d2 > minD * minD) continue;

          const d = Math.sqrt(d2);
          const nx = dx / d;
          const ny = dy / d;
          const overlap = minD - d;

          // 只分开，不做“自动换位”
          a.x -= nx * overlap * 0.5;
          a.y -= ny * overlap * 0.5;
          b.x += nx * overlap * 0.5;
          b.y += ny * overlap * 0.5;

          const rvx = b.vx - a.vx;
          const rvy = b.vy - a.vy;
          const vn = rvx * nx + rvy * ny;
          if (vn >= 0) continue;

          // 篮子附近碰撞减弱，避免字在篮子里自己串位
          const bounce = aroundBasket ? 0.12 : 0.58;
          const impulse = -(1 + bounce) * vn / 2;

          a.vx -= impulse * nx;
          a.vy -= impulse * ny;
          b.vx += impulse * nx;
          b.vy += impulse * ny;

          if (aroundBasket) {
            a.vx *= 0.92;
            b.vx *= 0.92;
            a.vy *= 0.94;
            b.vy *= 0.94;
          }

          a.av -= impulse * 0.01;
          b.av += impulse * 0.01;
        }
      }
    }

    function forceSeparate(list, gap = 10) {
      for (let loop = 0; loop < 8; loop++) {
        for (let i = 0; i < list.length; i++) {
          for (let j = i + 1; j < list.length; j++) {
            const a = list[i];
            const b = list[j];
            const minD = a.r + b.r + gap;

            let dx = b.x - a.x;
            let dy = b.y - a.y;
            let d = Math.hypot(dx, dy);

            if (d >= minD) continue;

            if (d < 0.001) {
              dx = rand(-1, 1);
              dy = rand(-1, 1);
              d = Math.hypot(dx, dy) || 1;
            }

            const nx = dx / d;
            const ny = dy / d;
            const overlap = minD - d;

            a.x -= nx * overlap * 0.5;
            a.y -= ny * overlap * 0.5;
            b.x += nx * overlap * 0.5;
            b.y += ny * overlap * 0.5;
          }
        }
      }
    }

    function stabilizeBasketLetters(g) {
      if (g.phase !== "playing") return;

      const b = g.basket;
      const inside = getCaughtLetters(g);
      if (inside.length === 0) return;

      // 只做防重叠和轻微阻尼，不改变它们原来的相对排序
      forceSeparate(inside, 10);

      inside.forEach((o) => {
        o.vx *= 0.86;
        o.vy *= 0.9;
        o.av *= 0.82;

        o.x = clamp(o.x, b.x - b.width * 0.47, b.x + b.width * 0.47);
        o.y = clamp(o.y, b.y - b.height * 0.9, b.y - b.height * 0.12);
      });

      forceSeparate(inside, 10);

      inside.forEach((o) => {
        o.x = clamp(o.x, b.x - b.width * 0.47, b.x + b.width * 0.47);
        o.y = clamp(o.y, b.y - b.height * 0.9, b.y - b.height * 0.12);
      });
    }

    function extractResultFromBasket(g) {
      const caught = getCaughtLetters(g);
      return {
        chars: caught.map((o) => o.ch),
        selected: caught
      };
    }

    function prepareEnding(g) {
      g.phase = "ending";
      g.endingTime = 0;
      g.lineProgress = 0;
      g.wipeDone = false;
      g.showFinalText = false;

      const b = g.basket;
      b.displayX = b.x;
      b.displayY = b.y;

      const { chars: resultChars, selected } = extractResultFromBasket(g);
      g.result = resultChars.join("");

      // 接到什么就是什么：直接把篮子里现有的字作为最终展示字，不新增、不替换、不重排
      selected.forEach((o) => {
        o.showcase = {
          dx: o.x - b.x,
          dy: o.y - b.y
        };
        o.vx = 0;
        o.vy = 0;
        o.angle *= 0.5;
      });

      updateHud();
    }

    function pushOverflowAboveBasket(g) {
      const b = g.basket;
      const bx = b.displayX;
      const by = b.displayY;
      const basketTop = by - b.height;

      g.letters.forEach((o) => {
        if (o.dead || o.showcase) return;

        const aroundRaisedBasket =
          Math.abs(o.x - bx) < b.width * 1.25 &&
          o.y < by + 10 &&
          o.y > basketTop - b.height * 1.25;

        const aboveBasketHeight = o.y + o.r * 0.2 < basketTop;
        const stackedTooHighNearBasket = aroundRaisedBasket && o.y < basketTop + o.r * 0.65;

        if (aboveBasketHeight || stackedTooHighNearBasket || aroundRaisedBasket) {
          o.pushed = true;
          const direction = o.x < bx ? -1 : 1;
          o.vx = direction * rand(320, 520);
          o.vy = -rand(220, 380);
          o.av += direction * rand(4.5, 7.5);
        }
      });
    }

    function stabilizeShowcaseLetters(g) {
      const showcase = g.letters.filter((o) => o.showcase && !o.dead);
      if (showcase.length <= 1) return;

      forceSeparate(showcase, 10);

      const b = g.basket;
      showcase.forEach((o) => {
        o.x = clamp(o.x, b.displayX - b.width * 0.47, b.displayX + b.width * 0.47);
        o.y = clamp(o.y, b.displayY - b.height * 0.9, b.displayY - b.height * 0.12);
      });

      // 把修正后的相对位置写回 showcase 目标，保证最终仍然稳定
      showcase.forEach((o) => {
        o.showcase.dx = o.x - b.displayX;
        o.showcase.dy = o.y - b.displayY;
      });
    }

    function update(dt) {
      const g = game;
      if (!g) return;
      dt = Math.min(dt, 1 / 24);

      const b = g.basket;
      const s = basketSize(g.w, g.h);
      b.width = s.width;
      b.height = s.height;
      b.line = s.line;

      b.x += (b.targetX - b.x) * Math.min(1, dt * 15);
      b.x = clamp(b.x, b.width / 2 + 24, g.w - b.width / 2 - 24);

      if (g.phase === "playing") {
        g.time += dt;
        spawn(dt);
        if (g.time >= PLAY_SECONDS) prepareEnding(g);
      }

      if (g.phase === "ending") {
        g.endingTime += dt;

        // 篮子抬升更丝滑、稍慢
        const liftEase = easeInOutCubic(g.endingTime / 1.55);
        b.displayX = b.x + (g.w * 0.5 - b.x) * liftEase;
        b.displayY = b.y + (g.h * 0.565 - b.y) * liftEase;

        g.lineY = b.displayY - b.height * 1.02;

        if (g.endingTime > 1.08) {
          g.lineProgress = easeOutCubic((g.endingTime - 1.08) / 0.82);
        }

        if (!g.wipeDone && g.lineProgress > 0.58) {
          g.wipeDone = true;
          pushOverflowAboveBasket(g);
        }

        if (g.endingTime > 2.15) {
          g.showFinalText = true;
        }
      }

      const gravity = g.phase === "ending" ? 1120 : 1180;
      const segs = basketSegments(g, g.phase === "ending");

      for (const o of g.letters) {
        if (o.dead) continue;

        o.prevX = o.x;
        o.prevY = o.y;

        if (g.phase === "ending" && o.showcase) {
          const targetX = b.displayX + o.showcase.dx;
          const targetY = b.displayY + o.showcase.dy;

          // 保持原本在篮子里的相对位置，一起抬上去
          o.x += (targetX - o.x) * Math.min(1, dt * 9.5);
          o.y += (targetY - o.y) * Math.min(1, dt * 9.5);
          o.vx = 0;
          o.vy = 0;
          o.angle *= 0.82;

          if (Math.abs(o.x - targetX) < 0.55) o.x = targetX;
          if (Math.abs(o.y - targetY) < 0.55) o.y = targetY;
          continue;
        }

        o.vy += gravity * dt;
        o.vx *= Math.pow(o.pushed ? 0.986 : 0.993, dt * 60);
        o.vy *= Math.pow(0.999, dt * 60);
        o.x += o.vx * dt;
        o.y += o.vy * dt;
        o.angle += o.av * dt;
        o.angle = clamp(o.angle, -0.28, 0.28);
        o.av *= Math.pow(0.93, dt * 60);

        if (o.x - o.r < 6) {
          o.x = o.r + 6;
          o.vx = Math.abs(o.vx) * 0.62;
        }
        if (o.x + o.r > g.w - 6) {
          o.x = g.w - o.r - 6;
          o.vx = -Math.abs(o.vx) * 0.62;
        }

        if (o.y + o.r > g.groundY) {
          o.y = g.groundY - o.r;
          if (Math.abs(o.vy) > 30) {
            o.vy = -o.vy * (o.extra ? 0.56 : 0.48);
            o.vx += rand(-54, 54);
            o.av += rand(-1.1, 1.1);
          } else {
            o.vy = 0;
          }
          o.vx *= 0.83;
          o.av *= 0.72;
        }

        const basketX = g.phase === "ending" ? b.displayX : b.x;
        const basketY = g.phase === "ending" ? b.displayY : b.y;
        const nearBasket =
          !o.pushed &&
          o.y + o.r > basketY - b.height - 38 &&
          o.y - o.r < basketY + 34 &&
          Math.abs(o.x - basketX) < b.width * 1.05;

        if (nearBasket) {
          for (const s of segs) {
            collideCircleSegment(o, s, o.extra ? 0.68 : 0.62, 0.72);
          }
        }
      }

      const activeLetters = g.letters.filter((o) => !o.dead);
      for (let k = 0; k < 6; k++) resolveLetterPairs(activeLetters, g);

      stabilizeBasketLetters(g);
      if (g.phase === "ending") stabilizeShowcaseLetters(g);

      g.letters = g.letters.filter((o, idx) => {
        if (o.dead) return false;
        if (g.phase === "ending") {
          if (o.pushed && (o.x < -90 || o.x > g.w + 90 || o.y < -120 || o.y > g.h + 120)) return false;
          return true;
        }
        if (o.showcase || o.extra) return true;
        return idx > g.letters.length - 82;
      });
    }

    function drawTextSticker(text, x, y, fontSize, fill, angle = 0, align = "center") {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(angle);
      ctx.textAlign = align;
      ctx.textBaseline = "middle";
      ctx.font = `900 ${fontSize}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.lineJoin = "round";
      ctx.miterLimit = 2;
      ctx.shadowColor = "rgba(0,0,0,0.84)";
      ctx.shadowBlur = 8;
      ctx.shadowOffsetY = 3;

      ctx.lineWidth = Math.max(8, fontSize * 0.2);
      ctx.strokeStyle = "rgba(0,0,0,0.92)";
      ctx.strokeText(text, 0, 0);

      ctx.lineWidth = Math.max(5, fontSize * 0.13);
      ctx.strokeStyle = "#ffffff";
      ctx.strokeText(text, 0, 0);

      ctx.fillStyle = fill;
      ctx.fillText(text, 0, 0);
      ctx.restore();
    }

    function drawBasket(g, useDisplay = false) {
      const segs = basketSegments(g, useDisplay);
      ctx.save();
      ctx.lineCap = "butt";
      ctx.lineJoin = "miter";
      ctx.lineWidth = g.basket.line;
      ctx.strokeStyle = "#ffc178";
      ctx.shadowColor = "rgba(255, 193, 120, 0.35)";
      ctx.shadowBlur = 5;

      ctx.beginPath();
      ctx.moveTo(segs[1].bx, segs[1].by);
      ctx.lineTo(segs[1].ax, segs[1].ay);
      ctx.lineTo(segs[0].bx, segs[0].by);
      ctx.lineTo(segs[2].bx, segs[2].by);
      ctx.stroke();
      ctx.restore();
    }

    function drawTitle(g) {
      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.min(46, g.w * 0.11)}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.lineJoin = "round";
      ctx.shadowColor = "rgba(0,0,0,0.96)";
      ctx.shadowBlur = 9;
      ctx.shadowOffsetY = 3;

      ctx.lineWidth = 10;
      ctx.strokeStyle = "#000";
      ctx.strokeText("前世我叫什么", g.w / 2, g.titleY);

      ctx.lineWidth = 3.5;
      ctx.strokeStyle = "#ffffff";
      ctx.strokeText("前世我叫什么", g.w / 2, g.titleY);

      ctx.fillStyle = "#ffffff";
      ctx.fillText("前世我叫什么", g.w / 2, g.titleY);
      ctx.restore();
    }

    function drawFinalLabel(g) {
      const b = g.basket;
      const labelY = b.displayY - b.height * 1.9;

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.min(29, g.w * 0.068)}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.lineJoin = "round";
      ctx.lineWidth = 6;
      ctx.strokeStyle = "#000";
      ctx.strokeText("我的前世名字是", g.w / 2, labelY);
      ctx.fillStyle = "#ffd29a";
      ctx.fillText("我的前世名字是", g.w / 2, labelY);
      ctx.restore();
    }

    function drawResultText(g) {
      if (!g.showFinalText) return;

      const b = g.basket;
      const y = b.displayY + b.height * 0.76;
      const text = g.result || "未接到字";

      ctx.save();
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.font = `900 ${Math.min(25, g.w * 0.06)}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
      ctx.lineJoin = "round";
      ctx.lineWidth = 5;
      ctx.strokeStyle = "#000";
      ctx.strokeText(text, g.w / 2, y);
      ctx.fillStyle = "#ffffff";
      ctx.fillText(text, g.w / 2, y);
      ctx.restore();
    }

    function draw() {
      const g = game;
      if (!g) return;

      ctx.clearRect(0, 0, g.w, g.h);
      ctx.fillStyle = "#000";
      ctx.fillRect(0, 0, g.w, g.h);

      const grad = ctx.createLinearGradient(0, g.titleY - 95, 0, g.titleY - 35);
      grad.addColorStop(0, "rgba(255,255,255,0.06)");
      grad.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grad;
      ctx.fillRect(0, g.titleY - 100, g.w, 82);

      drawTitle(g);

      ctx.save();
      ctx.strokeStyle = "rgba(210,210,210,0.82)";
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(18, g.groundY + 1);
      ctx.lineTo(g.w - 18, g.groundY + 1);
      ctx.stroke();
      ctx.restore();

      // 普通字
      for (const o of g.letters) {
        if (o.showcase || o.dead) continue;
        drawTextSticker(o.ch, o.x, o.y, o.font, o.color, o.angle);
      }

      drawBasket(g, g.phase === "ending");

      // 横线
      if (g.phase === "ending" && g.lineProgress > 0.01) {
        const x0 = g.w - g.w * g.lineProgress;
        ctx.save();
        ctx.strokeStyle = "rgba(255, 213, 157, 0.96)";
        ctx.lineWidth = 4;
        ctx.shadowColor = "rgba(255, 193, 120, 0.78)";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(x0, g.lineY);
        ctx.lineTo(g.w + 8, g.lineY);
        ctx.stroke();
        ctx.restore();
      }

      if (g.phase === "ending" && g.showFinalText) {
        drawFinalLabel(g);
      }

      // 最终篮子里的字
      for (const o of g.letters) {
        if (!o.showcase || o.dead) continue;
        drawTextSticker(o.ch, o.x, o.y, o.font, o.color, o.angle);
      }

      if (g.phase === "ending" && g.showFinalText) {
        drawResultText(g);
      }

      if (g.phase === "ready") {
        ctx.save();
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.font = `700 ${Math.min(18, g.w * 0.045)}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = "rgba(255,255,255,0.72)";
        ctx.fillText("拖动小篮子，5秒内接住掉下来的字", g.w / 2, g.h * 0.54);
        ctx.font = `900 ${Math.min(30, g.w * 0.075)}px system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif`;
        ctx.fillStyle = "#ffc178";
        ctx.fillText("点击开始", g.w / 2, g.h * 0.6);
        ctx.restore();
      }
    }

    function tick(now) {
      const dt = (now - last) / 1000;
      last = now;

      update(dt);
      draw();

      hudTimer += dt;
      if (game && hudTimer > 0.15) {
        hudTimer = 0;
        updateHud();
      }

      raf = requestAnimationFrame(tick);
    }

    function pointerX(e) {
      const rect = canvas.getBoundingClientRect();
      return e.clientX - rect.left;
    }

    function onPointerDown(e) {
      e.preventDefault();
      if (!game) return;

      if (game.phase === "ready") startGame();
      else if (game.phase === "ending") restart();

      if (game.phase === "playing") {
        game.pointerDown = true;
        game.basket.targetX = pointerX(e);
      }
    }

    function onPointerMove(e) {
      if (!game || game.phase !== "playing") return;
      if (!game.pointerDown && e.buttons !== 1) return;

      e.preventDefault();
      game.basket.targetX = pointerX(e);
    }

    function onPointerUp() {
      if (game) game.pointerDown = false;
    }

    function onKey(e) {
      if (!game) return;

      if (e.code === "Space" || e.code === "Enter") {
        if (game.phase === "ready") startGame();
        else if (game.phase === "ending") restart();
      }

      if (game.phase !== "playing") return;
      if (e.key === "ArrowLeft" || e.key.toLowerCase() === "a") game.basket.targetX -= 40;
      if (e.key === "ArrowRight" || e.key.toLowerCase() === "d") game.basket.targetX += 40;
    }

    restartBtn.addEventListener("click", (e) => {
      e.stopPropagation();
      restart();
    });

    window.addEventListener("resize", resize);
    window.addEventListener("keydown", onKey);
    canvas.addEventListener("pointerdown", onPointerDown, { passive: false });
    canvas.addEventListener("pointermove", onPointerMove, { passive: false });
    canvas.addEventListener("pointerup", onPointerUp);
    canvas.addEventListener("pointercancel", onPointerUp);

    newGame();
    resize();
    raf = requestAnimationFrame(tick);
  </script>
</body>
</html>
